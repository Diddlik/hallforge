<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HallForge — Performance, 1200×750</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; background: #0B0F17">
<dc-import name="Main" scenario="multi" theme="dark" rail="collapsed" height="{{h}}" hint-size="100%,750px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":750}}'>
class Component extends DCLogic {
  renderVals() { return { h: 750 }; }
}
</script>
</body>
</html>
