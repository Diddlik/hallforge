<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B79CFF"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#3B1A86"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCD3FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="220" fill="url(#bg)"/>
  <rect x="48" y="48" width="928" height="928" rx="220" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="8"/>
  <!-- Magnetic field lines around the hall sensor -->
  <g fill="none" stroke="#22D3EE" stroke-linecap="round" stroke-width="22" opacity="0.85">
    <path d="M300 780 A 260 120 0 0 0 724 780" stroke-opacity="0.35"/>
    <path d="M360 760 A 170 70 0 0 0 664 760" stroke-opacity="0.6"/>
  </g>
  <!-- H as two switch stems joined by the actuation bar -->
  <g fill="url(#cap)">
    <rect x="292" y="232" width="120" height="472" rx="44"/>
    <rect x="612" y="232" width="120" height="472" rx="44"/>
    <rect x="380" y="420" width="264" height="104" rx="40"/>
  </g>
  <!-- Sensor dot -->
  <circle cx="512" cy="812" r="90" fill="url(#glow)"/>
  <circle cx="512" cy="812" r="38" fill="#22D3EE" stroke="#0B0F17" stroke-width="12"/>
</svg>
